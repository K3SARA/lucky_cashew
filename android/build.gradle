// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'com.google.gms:google-services:4.4.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    afterEvaluate { project ->
        project.tasks.matching { task ->
            task.name == 'extractDebugAnnotations' || task.name == 'extractReleaseAnnotations'
        }.configureEach {
            enabled = false
        }

        def ensureTypedefTask = project.tasks.register('ensureCompatTypedefFiles') {
            doLast {
                ['debug', 'release'].each { variant ->
                    def typedefFile = project.file("${project.buildDir}\\intermediates\\annotations_typedef_file\\${variant}\\typedefs.txt")
                    if (!typedefFile.exists()) {
                        typedefFile.parentFile.mkdirs()
                        typedefFile.text = ''
                    }
                }
            }
        }

        project.tasks.matching { task ->
            task.name == 'extractDebugAnnotations' || task.name == 'extractReleaseAnnotations'
        }.configureEach {
            enabled = false
        }

        project.tasks.matching { task ->
            task.name == 'syncDebugLibJars' || task.name == 'syncReleaseLibJars'
        }.configureEach {
            dependsOn ensureTypedefTask
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
